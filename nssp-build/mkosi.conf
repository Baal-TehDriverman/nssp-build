[Distribution]
Distribution=arch
Release=rolling
Architecture=x86-64

[Output]
Format=uki
Output=lilith-os-uki
OutputDirectory=../iso

[Content]
Packages=base
Packages=linux-zen
Packages=linux-zen-headers
Packages=linux-firmware
Packages=btrfs-progs
Packages=cryptsetup
Packages=systemd
Packages=systemd-ukify
Packages=mkinitcpio
Packages=systemd-sysvcompat
Packages=networkmanager
Packages=sudo
Packages=fish
Packages=git
Packages=age
Packages=sops
Packages=chezmoi
Packages=snapper
Packages=grub
Packages=efibootmgr
Packages=sbctl
Packages=podman
Packages=buildah
Packages=skopeo
Packages=containerd
Packages=docker-compose
Packages=python
Packages=python-pip
Packages=rustup
Packages=go
Packages=nodejs
Packages=npm
Packages=bun
Packages=zig
Packages=neovim
Packages=fzf
Packages=ripgrep
Packages=fd
Packages=bat
Packages=eza
Packages=atuin
Packages=lazygit
Packages=gitui
Packages=tailscale
Packages=wireguard-tools
Packages=nftables
Packages=firewalld
Packages=prometheus
Packages=grafana
Packages=vector
Packages=loki
Packages=restic
Packages=rclone
Packages=timeshift
Packages=himalaya
Packages=ffmpeg
Packages=yt-dlp
Packages=imagemagick
Packages=blender
Packages=obs-studio

[Boot]
Bootable=yes
Bootloader=systemd-boot
UEFI=yes
UKI=yes
SecureBoot=yes
Kernel=linux-zen
KernelCommandLine=root=LABEL=LILITH_ROOT rootflags=subvol=@,compress=zstd:3,noatime rw quiet loglevel=3 systemd.show_status=auto rd.udev.log_level=3

[Security]
SELinux=off
AppArmor=off
TPM2=yes
SecureBoot=yes

[Scripts]
PreScript=/home/tehlappy/🜏 Lilith/nssp-build/scripts/pre-install.sh
PostScript=/home/tehlappy/🜏 Lilith/nssp-build/scripts/post-install.sh

[Overlay]
Directory=../overlays

[Environment]
LANG=en_US.UTF-8
LC_ALL=en_US.UTF-8
TZ=America/Los_Angeles

[Hostname]
Hostname=lilith

[User]
Name=tehlappy
Password=1385
Groups=wheel kvm render video docker libvirt input
DefaultShell=/usr/bin/fish

[Locale]
Locale=en_US.UTF-8
Keyboard=us
Timezone=America/Los_Angeles