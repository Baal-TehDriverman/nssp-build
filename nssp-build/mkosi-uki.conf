# NSSP Lilith OS - mkosi.default configuration
# Place in nssp-build/ directory

[Distribution]
Distribution=arch
Release=rolling
Architecture=x86_64

[Output]
Output=lilith-os-uki
OutputDirectory=../iso

[Content]
Packages=base linux-zen linux-zen-headers linux-firmware
Packages=btrfs-progs cryptsetup systemd systemd-ukify mkinitcpio networkmanager
Packages=sudo fish git age sops chezmoi snapper
Packages=grub efibootmgr sbctl
Packages=nvidia nvidia-utils nvidia-settings cuda cudnn
Packages=podman buildah skopeo containerd docker-compose
Packages=python python-pip python-pixi rustup go nodejs npm bun zig
Packages=neovim lazyvim code zed
Packages=fzf ripgrep fd bat eza delta atuin lazygit gitui gh
Packages=tailscale wireguard-tools nftables firewalld
Packages=prometheus grafana node-exporter nvidia-gpu-exporter
Packages=vector loki restic rclone snapper timeshift
Packages=himalaya ffmpeg yt-dlp imagemagick manim blender obs-studio
Packages=comfyui ollama vllm llama.cpp whisper.cpp piper
Packages=chaotic-aur/hermes-agent chaotic-aur/lilith-gateway chaotic-aur/cua-driver

[Boot]
Bootable=yes
Bootloader=systemd-boot
UEFI=yes
UKI=yes
SecureBoot=auto
Kernel=linux-zen
KernelCommandLine=root=LABEL=LILITH_ROOT rootflags=subvol=@,compress=zstd:3,noatime rw quiet loglevel=3 systemd.show_status=auto rd.udev.log_level=3

[PartitionTable]
Type=gpt

[Partition /boot/efi]
Type=efi
Size=1G
Format=vfat
Label=LILITH_EFI
MountPoint=/boot/efi

[Partition swap]
Type=swap
Size=32G
Format=swap
Label=LILITH_SWAP

[Partition /]
Type=root
Size=0
Format=btrfs
Label=LILITH_ROOT
MountPoint=/
BtrfsSubvolumes=@ @home @snapshots @var_log @var_cache @opt @srv @lilith
BtrfsCompress=zstd:3

[Security]
SELinux=off
AppArmor=off
TPM2=yes
SecureBoot=auto

[Scripts]
PreScript=scripts/prepare.sh
PostScript=scripts/verify.sh

[Overlay]
Directory=overlays

[Environment]
LANG=en_US.UTF-8
LC_ALL=en_US.UTF-8
TZ=America/Los_Angeles

[Hostname]
Hostname=lilith

[User]
Name=tehlappy
Password=1385
Groups=wheel kvm render video docker libvirt input
DefaultShell=/usr/bin/fish

[Locale]
Locale=en_US.UTF-8
Keyboard=us
Timezone=America/Los_AngelesFormat=uki
